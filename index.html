<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logocircular.jpeg" />
    <link rel="apple-touch-icon" href="/logocircular.jpeg" />
    <meta name="theme-color" content="#05002e" />
    <meta name="description" content="Plataforma de ensino YV English" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>YV English Hub</title>
  </head>
  <body>
    <div id="root">
      <style>
        #initial-loader {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          background: #05002e;
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 9999;
        }
        #initial-loader img {
          width: 120px;
          height: 120px;
          border-radius: 50%;
          animation: pulse 2s infinite;
          box-shadow: 0 0 30px rgba(200, 136, 58, 0.3);
        }
        @keyframes pulse {
          0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(200, 136, 58, 0.7); }
          70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(200, 136, 58, 0); }
          100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(200, 136, 58, 0); }
        }
      </style>
      <div id="initial-loader">
        <img src="/logocircular.jpeg" alt="YV English" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
